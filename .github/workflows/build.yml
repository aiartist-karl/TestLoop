name: Build iOS
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project TestLoop.xcodeproj -scheme TestLoop -destination generic/platform=iOS -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build build
      - uses: actions/upload-artifact@v4
        with:
          name: TestLoop
          path: build/Build/Products/Release-iphoneos/*.app
